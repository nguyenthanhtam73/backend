name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dadiary
          POSTGRES_PASSWORD: dadiary
          POSTGRES_DB: dadiary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dadiary -d dadiary"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          # TestDeleteAccount_PostgresFKAndSchema skips when this is empty.
          # The Railway deploy workflow does not set it and does not run tests.
          DADIARY_DATABASE_URL: postgres://dadiary:dadiary@localhost:5432/dadiary?sslmode=disable
        run: go test ./... -count=1 -timeout 20m
